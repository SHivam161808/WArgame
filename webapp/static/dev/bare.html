<!doctype html><html><head><link href="https://cdn.jsdelivr.net/npm/cesium@1.124/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>html,body,#c{margin:0;width:100%;height:100%}</style></head><body><div id="c"></div>
<script>window.CESIUM_BASE_URL='https://cdn.jsdelivr.net/npm/cesium@1.124/Build/Cesium/';</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.124/Build/Cesium/Cesium.js"></script>
<script type="module">
import { terrariumProvider } from '/static/js/globe.js';
const q = new URLSearchParams(location.search);
const v = new Cesium.Viewer('c', { baseLayer: Cesium.ImageryLayer.fromProviderAsync(Promise.resolve(new Cesium.UrlTemplateImageryProvider({url:'https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless_3857/default/g/{z}/{y}/{x}.jpg', tilingScheme:new Cesium.WebMercatorTilingScheme(), maximumLevel:15}))),
  terrainProvider: q.get('terrain') ? terrariumProvider() : new Cesium.EllipsoidTerrainProvider(), animation:false, timeline:false, baseLayerPicker:false, geocoder:false });
v.camera.setView({destination: Cesium.Cartesian3.fromDegrees(70.0, 27.4, 25000), orientation:{heading:0,pitch:-0.66,roll:0}});
window.V = v;
</script></body></html>
