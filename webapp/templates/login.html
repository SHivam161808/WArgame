{% extends "base.html" %}
{% block title %}Exercise Controller login · AI-DSSW{% endblock %}
{% block content %}
<div class="container" style="max-width:420px;padding-top:12vh">
  <div class="panel">
    <div class="panel-head"><i class="bi bi-shield-lock"></i> Exercise Controller</div>
    <div class="panel-body">
      <form method="post" class="vstack gap-3">{% csrf_token %}
        <div><label class="form-label small text-muted2">Username</label><input class="form-control" name="username" autofocus required></div>
        <div><label class="form-label small text-muted2">Password</label><input class="form-control" type="password" name="password" required></div>
        {% if error %}<div class="text-danger small">{{ error }}</div>{% endif %}
        <button class="btn btn-tac">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
